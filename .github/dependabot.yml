version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dev-tools:
        patterns: ['ruff', 'pyright', 'pytest*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      three-stack:
        # three is pinned to match Photo Sphere Viewer; update these together.
        patterns:
          [
            'three',
            '@types/three',
            '@react-three/*',
            'postprocessing',
            '@photo-sphere-viewer/*',
          ]
      next-react:
        patterns:
          ['next', 'eslint-config-next', 'react', 'react-dom', '@types/react*']
      test-tools:
        patterns: ['vitest', 'vite', '@vitejs/*', '@testing-library/*', 'jsdom']
    ignore:
      # Photo Sphere Viewer depends on three ^0.185; a newer three would ship
      # a second copy. Bump three by hand together with a PSV release.
      - dependency-name: 'three'
        update-types: ['version-update:semver-minor']
      - dependency-name: '@types/three'
        update-types: ['version-update:semver-minor']
      # typescript-eslint does not support TypeScript 7 yet.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # eslint-config-next's React plugin breaks on ESLint 10.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      # Node types follow the runtime in .nvmrc (24 LTS).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
