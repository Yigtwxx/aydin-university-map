name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Repo guard (no tour data, no secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Block data/ and heavy binaries
        run: python tools/repo_guard.py
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python:
    name: Python (ruff, pyright, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Install workspace
        run: uv sync --all-packages --extra recon --extra geo --extra db --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Pyright
        run: uv run pyright
      - name: Pytest
        run: uv run pytest -m "not db and not recon"

  web:
    name: Web (prettier, eslint, tsc, vitest, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Prettier
        run: pnpm format:check
      - name: ESLint
        run: pnpm --filter web lint
      - name: Typecheck
        run: pnpm --filter web typecheck
      - name: Vitest
        run: pnpm --filter web test
      - name: Build
        run: pnpm --filter web build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid

  e2e:
    name: E2E (Playwright, axe)
    runs-on: ubuntu-latest
    # One worker on software WebGL (SwiftShader): about a minute per test.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The API alone (no pipeline extras): the suite starts it with the
      # offline assistant model, the published graph and no database.
      - name: Install
        run: |
          uv sync --package amap-api --frozen
          pnpm install --frozen-lockfile
      - name: Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium
      # playwright.config.ts starts the API on :8010 and a production build
      # of the web app on :3010.
      - name: Playwright
        run: pnpm --filter web test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14

  contracts:
    name: Contract drift (OpenAPI -> TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: |
          uv sync --package amap-api --frozen
          pnpm install --frozen-lockfile
      - name: OpenAPI schema is up to date
        run: |
          uv run --package amap-api python -m amap_api.export_openapi
          git diff --exit-code apps/api/openapi.json
      - name: TypeScript types are up to date
        run: |
          pnpm --filter web gen:api
          git diff --exit-code apps/web/src/lib/api/schema.d.ts
