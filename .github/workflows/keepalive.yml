name: Keepalive

# Supabase pauses free projects after a week without database activity; the
# API's /health runs `select 1`, so one call a day keeps it awake.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: API health (and database ping)
        run: |
          body=$(curl -fsS --retry 3 --retry-delay 20 https://aydin-campus-api.vercel.app/health)
          echo "$body"
          echo "$body" | grep -q '"database":"ok"'
      - name: Assets reachable
        run: curl -fsS -o /dev/null https://aydin-campus-assets.pages.dev/graph.geojson
