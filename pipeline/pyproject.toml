[project]
name = "amap-pipeline"
version = "0.1.0"
description = "Offline pipeline: tour metadata, tile acquisition, SfM/MVS reconstruction, georeferencing and walking-graph export."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "amap-contracts",
    "numpy>=2.2",
    "pillow>=11.3",
    "typer>=0.17",
]

[project.scripts]
amap = "amap_pipeline.cli:app"

[project.optional-dependencies]
recon = [
    "pycolmap>=4.2.1",
]
geo = [
    "pyproj>=3.7",
    "scipy>=1.15",
    "shapely>=2.1",
]
db = [
    "psycopg[binary]>=3.3",
    "python-dotenv>=1.1",
]
# Pretrained ALIKED + LightGlue inference on CUDA/MPS (no training). Heavy, so
# CI and start.sh never install it.
learned = [
    "kornia==0.8.3",
    "torch>=2.14",
]

[tool.uv.sources]
amap-contracts = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amap_pipeline"]
