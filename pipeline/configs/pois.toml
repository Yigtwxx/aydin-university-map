# Businesses and services on campus. Read by `amap export pois`.
#
# node:     the tour panorama of the place (route target). own_panorama = false
#           when that panorama is just a nearby spot (the POI becomes its own
#           place, `poi:<id>`, instead of renaming the panorama's place).
# landmark: the survey tie point at the storefront (configs/survey/*.toml);
#           once measured, the map pin stands there.
# verified: checked with ordinary web search (store locators, official pages,
#           recent reviews). The tour is years old: closed places stay listed
#           here so their tour labels are kept out of search.

