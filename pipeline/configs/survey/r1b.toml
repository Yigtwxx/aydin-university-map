# Area r1b: B and D west (B Blok Giris, M Blok Giris, D Blok Giris north, the
# panoramas between B and D). Sightings measured with amap look.
#
# The B Blok Giris portico columns (r1b.b.portico.*) are placed by 556, 557 and
# pilot scene 552; the D Blok Giris portico columns (r1b.d.portico.*: f/b =
# front/back row, e/w = east/west) by 336, 566, 569 and 559. The white quoin at
# the north end of A's brick west facade is a tie (r1b.a.w_quoin): it sits ~3 m
# south of A#0, so A#0 is not used here.
#
# D's north facade is not straight: a curved, recessed glass/maroon central bay
# holds the portico between two tan wings (OSM draws one straight line). From
# 336 a tan facade end shows at ath 15.1; it does not fit OSM D#3 with the
# other sightings (likely the west wing's return), so it is not used.
#
# The D cluster (336, 566, 569) and 558/559 lie along the E-W street, so the
# rays are nearly collinear and the along-street position is weak. Their init
# and prior_sigma_m come from a separate adjustment that added base-depression
# distances (558: B's NE corner 4.3 m; 559: D#0 7.2 m, B#0 4.8 m) and the
# portico columns' angular size from 559 (~26 m). Without these priors, the
# arrows to m0 neighbours 565/567/568 drag the cluster ~20 m east onto D#0;
# with 3 m priors the solver still sometimes lands in a wrong basin ~10-17 m
# west (D#3 pulled 7 m), so the D cluster uses 1.5 m. Its true along-street
# uncertainty is ~3 m.

[scenes.scene_428557]
pose = "free"
note = "B Blok Giris: courtyard between B's east face (portico 4 m W) and A's west face; IAU book store N, B-N passage NW"
obs = [
  { lm = "r2.flag.plaza", ath = 40.22, sigma_deg = 0.3 },
  { lm = "r1b.a.w_quoin", ath = 290.73, sigma_deg = 0.8 },
  { lm = "A#1", ath = 0.82, sigma_deg = 0.8 },
  { lm = "r1b.b.portico.col_s", ath = 89.65, sigma_deg = 0.5 },
  { lm = "r1b.b.portico.col_n", ath = 154.38, sigma_deg = 0.5 },
  { lm = "B#1", ath = 199.6, sigma_deg = 0.8 },
]

