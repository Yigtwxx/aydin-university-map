# Area r5: T Blok (Sosyal Bilimler Kampusu) and its sunken garden on Akasya Sokagi.
# Sightings measured with amap look.
# 2026-10-08 T garden pass: 784-792 resected on T's own corners (T#1 east end,
# T#2 south corner, T#3 west corner), Biruni's corner (tie, ~2852#2) and 9833;
# 784/785 see only T#3 over the 5 m wall, so their priors come from the near
# depression distances (agree with the furniture.toml t-garden layout to ~1.3 m).
# Not used: 9811#2 / 2839#1 (balconied flats over the wall; their OSM corners
# disagree with 786's well-fixed heading by 2-6 deg, they distorted the
# rejected attempt). Tour arrows 783<->784 follow the stair and 791->792 the
# walk (792 is up in the forecourt behind the fence), so they stay outliers.
# 2026-10-08 788/789 check: the solve had 788-789 14.6 m, the panoramas ~18-20 m.
# 788 was the wrong one: its "Biruni" sighting at ath 118.5 was the NE corner of
# the ULUSOY transformer booth behind the fence gate (it hides Biruni), which
# pulled 788 ~5 m SE along T's face. Dropped; the arcade pillars are now ties
# seen from 788, 789 and 790 (outer-NW corners: the NW-face/outer-face boundary
# from 788, the left silhouette from 789/790) plus the end pier's SE corner
# (787, 788, 789). 789 stands beside P3, two bays (P4, P5) short of the south
# corner. With the old poses P2 would stand 2 m from 789 (it is 8 m back).
# Depression distances at 788 come out ~1.3x the solved ones (P1 5.0 vs 3.7 m)
# while 789's agree (P3 2.5, P2 8.6 m): a depression prior pulling 788 a
# further ~1 m NW fought T#2/T#3 and raised the RMS, so it is not used.

