# and 1. Akasya stand 3-6 m from the kerb, so the bank is narrow (3 m, ~47 deg).
# From ground.json and the OSM campus rings (relation 17252918):
# - Birlik Cd (west), Ali Ağa Sk (north-west) and 1. Akasya Sk (south) stay
#   outside: the ring runs bank + 0.3 m inside their kerbs, so the bank ends at
#   the kerb (the yard by Birlik is the datum; T Blok's street is at 0, so T and
#   its sunken garden stay outside). At the Birlik/Akasya corner the building
#   is 3 m from the kerb: the ring passes 0.3 m off it.
# - Fabrikalar Cd and Karadeniz Sk (street level 3.2 between the blocks) and
#   İnönü Cd (its sidewalk at the main gate is at 5.7) stay inside; the ring
