# Street furniture and terrain notebook (central campus). Read by
# `amap export furniture` -> data/out/furniture.json; the schema is
# amap_contracts.furniture. Coordinates: local metres (x east, y north).
# `evidence` and `note` stay in this file.
#
# Height datum (z = 0): the lowest level here, the south-west yard at the west
# end of the lane along D Blok. Levels were measured from step counts (riser
# ~0.15 m), wall heights and depression angles (camera 1.46 m above ground):
#
#   yard 0.0 | lane along D 0.6 | street level around E/F/K/D-north 3.2
#   square 4.0 (the lane's 23-step flight tops out here) | café square (north) 2.3
#   gate plaza 5.7 (square + ~1.7, 10-11 steps) | north deck 5.5 (café + 3.2, 20 steps)
#
# Nesting: `campus` (3.2, grassy bank at its rim) holds every other terrace; the
# renderer cuts the children out of it. Flights stand outside the terraces they
# join. The SfM camera heights in survey.json are per-model and were NOT used
# (they disagree across models); levels come from the observations above.

# ---------------------------------------------------------------- terraces

