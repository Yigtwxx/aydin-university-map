# Trees seen on the panoramas that OSM does not map. Read by
# `amap export greenery` and added to OSM's trees (one within 1.5 m of an OSM
# tree is that tree). Local metres [east, north]. A tree may set `height_m`,
# the whole tree from the ground to the crown top; without it a campus tree
# is 5.5 m (export/assets.py CAMPUS_TREE_M). Set only where the evidence says
# small or large.
#
# Found with `amap furniture detect --queries landmarks` (OWLv2, 94 outdoor
# panoramas) and `amap furniture locate`, then checked on the review sheets
# on 2026-10-08; positions are triangulated unless noted.

[[trees]]
at = [1.54, 2.71]
evidence = "conifer in the yellow-kerbed bed by the B Blok steps; 2 panoramas"

[[trees]]
at = [5.21, -33.2]
evidence = "blue spruce in the bed behind the south gate, by the rhino statue; 3 panoramas"

[[trees]]
at = [1.46, -49.73]
height_m = 8.0
evidence = "old plane tree in the pavement at the south gate; one panorama, monoplot"

