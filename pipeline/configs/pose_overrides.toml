# (J's camera even landed inside A). Both pictures show 1. İnönü Caddesi's fence
# and parked cars a few metres away; the street runs along the campus's east
# edge. The way there: face A's door, walk right to the end of A, turn into the
# passage; J (with the cafeteria) is on the left.

# "Kampüs" at A Blok's south-east corner: the corner is behind (ath 184), the
# street fence on the left, A's front runs off to the right.
