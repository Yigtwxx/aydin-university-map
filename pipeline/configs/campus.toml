# Campus blocks: which footprint is which block, corrected outlines, measured
# heights and facade recipes. Read by every command that loads footprints
# (geo/campus.py); evidence comes from the panorama survey (configs/survey,
# local metres east/north) and the signs on the walls.

[blocks.A]
name = { tr = "A Blok", en = "A Block" }
osm = ["way/1550440571"]   # corners A#0-A#3 within 1 m of their sightings
levels = 5
height_m = 20.0
height_source = "pano"
# cream upper floors, two brick-red storeys, white string courses; the brick
# entrance tower with its glass canopy stands on the south face (r2.a.tower.*)
[blocks.A.facade]
wall = "#d6c5a7"
plinth = "#8a3f2e"
trim = "#ece6dc"
glass = "#34475a"
