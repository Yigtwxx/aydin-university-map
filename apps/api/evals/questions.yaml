# Frozen evaluation set for the campus assistant (Step 4.4).
#
# 33 single-turn questions (17 TR, 16 EN) a student or visitor would ask about
# the Florya campus. Expectations are grounded in the data, not invented:
#
# - `facts` are copied from the knowledge base (`amap.chunks`, built by
#   `amap_pipeline.rag.corpus`). Each fact is a phrase, or a list of
#   alternative phrases, that occurs in at least one chunk of the question's
#   language. Context recall = share of facts found in what the tools returned.
# - `route` / `place` are ids of routable places (`build_places` over
#   data/out/graph.geojson and pois.json): entrances, open areas, businesses
#   and, since indoor routing, rooms. `place` may list several ids (rooms sharing a name). The default
#   start is "Kampüs Girişi" (scene_428518).
# - `tools`: `required` must all be called; at least one of `one_of` must be
#   called; `allowed` may be called. Any other call is a wrong tool. No tools
#   listed at all means the right answer needs no tool.
# - `abstain: true`: the answer must say it does not know / cannot do it
#   instead of inventing (menus, phone numbers, opening hours, no route).
#   Every other question must be answered: "I don't know" there is wrong.
#
# `uv run python apps/api/evals/run_eval.py --validate` checks every fact and
# place id against the database and the walking graph.
#
# Version 2 (indoor routing, 221 places): T Blok and the observatory became
# routable, so tr-route-05 and en-place-02 changed, and three questions cover
# rooms (tr-route-03: a name two rooms share, tr-route-05 and en-route-03:
# routes into a building). tr-know-06 and en-know-07 are the library question
# the chat suggests in the UI (QA: it was answered "I don't know"). The other
# 26 questions are unchanged from questions_v1.yaml, the first baseline's set.
#
# Version 3 adds tr-place-04, a floor question about a business (the canteen)
# that production answered with "no information"; the eval now loads pois.json
# like the API. The other 32 questions are unchanged.

version: 3
questions:
  # --- Turkish: routing ------------------------------------------------------
  - id: tr-route-01
    lang: tr
    category: route
    question: "E Blok'a nasıl giderim?"
    tools: { required: [get_route], allowed: [search_places, search_knowledge] }
    route: { from: scene_428518, to: scene_428538 }

  - id: tr-route-02
    lang: tr
    category: route
    question: "Kütüphane girişinden M Blok'a nasıl yürürüm?"
    tools: { required: [get_route], allowed: [search_places, search_knowledge] }
    route: { from: scene_428249, to: scene_428569 }

  - id: tr-route-03
    lang: tr
    category: route
    # Two rooms share the name (F Blok, T Blok): ask or name both, never guess.
    question: "Öğrenci İşleri'ne nasıl giderim?"
    tools: { one_of: [get_route, search_places], allowed: [search_knowledge] }
    place: [scene_428363, scene_428759]

  - id: tr-route-04
    lang: tr
    category: route
    question: "Merdiven kullanmadan O Blok'a gitmek istiyorum, nereden gideyim?"
    tools: { required: [get_route], allowed: [search_places, search_knowledge] }
    route: { from: scene_428518, to: scene_428571, avoid_stairs: true }

  - id: tr-route-05
    lang: tr
    category: route
    # A room: the route enters M Blok and climbs to the 5th floor.
    question: 'Hemşirelik sınıfına nasıl giderim?'
    tools: { required: [get_route], allowed: [search_places, search_knowledge] }
    route: { from: scene_428518, to: scene_428418 }

  # --- Turkish: place lookup -------------------------------------------------
  - id: tr-place-01
    lang: tr
    category: place
    question: 'Kütüphane nerede?'
    tools: { one_of: [search_places, get_route], allowed: [search_knowledge] }
    place: scene_428249

  - id: tr-place-02
    lang: tr
    category: place
    question: 'Revir nerede?'
    tools: { one_of: [search_places, get_route], allowed: [search_knowledge] }
    place: scene_428547

  - id: tr-place-03
    lang: tr
    category: place
    question: 'G Blok nerede?'
    tools: { one_of: [search_places, get_route], allowed: [search_knowledge] }
