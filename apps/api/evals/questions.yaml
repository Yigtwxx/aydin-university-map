  - id: tr-place-04
    lang: tr
    category: place
    # A business, not a tour label: "Yemekhane ve Kantin (T Blok)", 4th floor
    # (configs/pois.toml). Production answered "no information". The floor is
    # a number in the tool result, so the judge checks it, not `facts`.
    question: 'Yemekhane hangi katta?'
    tools:
      {
        required: [search_places],
        allowed: [search_knowledge, describe_place, get_route],
      }
    place: scene_428757
    facts: [T Blok]

  # --- Turkish: knowledge ----------------------------------------------------
  - id: tr-know-01
    lang: tr
    category: knowledge
    question: "T Blok'ta neler var?"
    tools: { required: [search_knowledge], allowed: [search_places] }
