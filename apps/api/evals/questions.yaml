      - Kantin
      - Muhasebe
      - Öğrenci İşleri
      - T Blok Fuaye
      - T Blok Bahçe
      - Amfi - 1 # "T Blok Sınıflar" area

  - id: tr-know-02
    lang: tr
    category: knowledge
    question: 'Kütüphanenin hangi katları var?'
    tools: { required: [search_knowledge], allowed: [search_places] }
